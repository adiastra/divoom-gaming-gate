name: Build Windows App

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toml

      - name: Ensure WiX license file exists
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.rtf")) {
            @"
{\rtf1\ansi\deff0
{\fonttbl{\f0 Arial;}}
\f0\fs20 Divoom Gaming Gate
\par
License: GPL-3.0-or-later
\par
See project repository for full license text.
}
"@ | Set-Content -Path "LICENSE.rtf" -Encoding ASCII
          }

      - name: Build Windows app
        run: |
          briefcase create windows
          briefcase build windows
          briefcase package windows

      - name: Upload to GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.msi --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
